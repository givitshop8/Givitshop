name: Build Givitshop APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Extract Givitshop
        run: |
          rm -rf project
          mkdir project
          unzip -o Givitshop_Siap_Build_Dari_HP.zip -d project
          echo "=== ISI PROJECT ==="
          ls -la project
          echo "=== ISI ANDROID ==="
          ls -la project/android

      - name: Build APK
        run: |
          cd project/android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Givitshop-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
