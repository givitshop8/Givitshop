name: Build Givitshop APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract latest Givitshop APK ZIP
        shell: bash
        run: |
          set -e
          ZIP="Givitshop_Siap_Build_Back_Badge_Cart_Fix_V2.zip"
          test -f "$ZIP"
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project
          test -f project/android/gradlew || true
          test -f project/android/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Build APK Debug
        working-directory: project/android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Givitshop-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
