name: Build Givitshop APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP V39 exists
        run: test -f Givitshop_Siap_Build_Foto_Beranda_V39.zip

      - name: Extract Givitshop V39
        run: |
          mkdir -p /tmp/givitshop
          unzip -o Givitshop_Siap_Build_Foto_Beranda_V39.zip -d /tmp/givitshop
          cp -R /tmp/givitshop/android/. android/
          cp -R /tmp/givitshop/web/. web/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Build APK Debug
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Givitshop-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

