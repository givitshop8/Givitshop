
name: Deploy Website Givitshop

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'admin/**'
      - 'Givitshop_Admin_Panel.zip'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Siapkan website dan admin
        run: |
          rm -rf site extracted
          mkdir -p site
          cp -R web/. site/

          if [ -f Givitshop_Admin_Panel.zip ]; then
            unzip -q Givitshop_Admin_Panel.zip -d extracted
            mkdir -p site/admin
            cp -R extracted/admin/. site/admin/
          elif [ -d admin ]; then
            mkdir -p site/admin
            cp -R admin/. site/admin/
          else
            echo "Folder admin tidak ditemukan"
            exit 1
          fi

          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website dan admin
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
