
name: Deploy Givitshop Admin and Website

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'admin/**'
      - 'Givitshop_Admin_Panel.zip'
      - '.github/workflows/admin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website and admin
        run: |
          set -e
          rm -rf site extracted
          mkdir -p site
          cp -R web/. site/
          unzip -q Givitshop_Admin_Panel.zip -d extracted
          mkdir -p site/admin
          cp -R extracted/admin/. site/admin/
          test -f site/index.html
          test -f site/admin/index.html
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
