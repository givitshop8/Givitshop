/* Givitshop: banner lebih ringkas, grid kategori/produk rapat */
html, body {
  margin:0 !important;
  padding:0 !important;
  width:100% !important;
  max-width:none !important;
  overflow-x:hidden;
}
.app {
  width:100% !important;
  max-width:1200px !important;
  margin:0 auto !important;
  padding-left:0 !important;
  padding-right:0 !important;
  box-shadow:0 0 24px rgba(0,0,0,.05) !important;
  border-radius:0 !important;
}
/* Kurangi tinggi banner tanpa mengubah gambarnya */
.hero, .banner, .hero-banner, .carousel {
  max-height:300px !important;
  overflow:hidden;
}
.hero img, .banner img, .hero-banner img, .carousel img {
  max-height:300px !important;
  object-fit:cover;
  object-position:center;
}
/* Kartu kategori dan produk melebar sampai tepi area konten */
.cats, .categories, .category-grid, #categories {
  width:100% !important;
  margin-left:0 !important;
  margin-right:0 !important;
  padding-left:0 !important;
  padding-right:0 !important;
  gap:8px !important;
}
.cat, .category-card, .category-item {
  margin-left:0 !important;
  margin-right:0 !important;
}
.product-grid, .products, #products, .product-list {
  width:100% !important;
  margin-left:0 !important;
  margin-right:0 !important;
  padding-left:0 !important;
  padding-right:0 !important;
  gap:8px !important;
}
.product, .product-card, .product-item {
  min-width:0 !important;
  margin-left:0 !important;
  margin-right:0 !important;
  border-radius:8px !important;
}
.pic {
  height:145px !important;
  min-height:145px !important;
  max-height:145px !important;
  padding:0 !important;
  overflow:hidden !important;
  background:#fff !important;
}
.pic .productimg {
  display:block !important;
  width:100% !important;
  height:100% !important;
  max-width:100% !important;
  max-height:100% !important;
  min-width:0 !important;
  min-height:0 !important;
  padding:3px !important;
  margin:0 auto !important;
  object-fit:contain !important;
  object-position:center !important;
}
@media (min-width:768px) {
  .app { max-width:1200px !important; margin:0 auto !important; }
  .hero, .banner, .hero-banner, .carousel,
  .hero img, .banner img, .hero-banner img, .carousel img {
    max-height:300px !important;
  }
}
@media (max-width:767px) {
  .app {
    width:100% !important;
    max-width:none !important;
    margin:0 !important;
    padding-left:0 !important;
    padding-right:0 !important;
    box-shadow:none !important;
  }
  .product-grid, .products, #products, .product-list {
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    gap:6px !important;
  }
}

async function sbFetch(path, options={}) {
  if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('GANTI_DENGAN')) {
    throw new Error('API key Supabase belum diisi.');
  }
  const headers = Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  }, options.headers || {});
  const res = await fetch(SUPABASE_URL + path, Object.assign({}, options, {headers}));
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e) {}
  if (!res.ok) throw new Error((data && (data.message || data.hint || data.error)) || text || ('HTTP '+res.status));
  return data;
}

async function edgeFetch(action, opts={}) {
  const headers = Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  }, opts.headers || {});
  const url = EDGE_FUNCTION_URL + '?action=' + encodeURIComponent(action) + (opts.query ? '&' + opts.query : '');
  const res = await fetch(url, Object.assign({}, opts, {headers}));
  const text = await res.text();
  let data=null; try { data=text ? JSON.parse(text) : null; } catch(e) {}
  if(!res.ok) throw new Error((data && (data.error || data.message || data.hint)) || text || ('HTTP '+res.status));
  return data;
}

async function calculateCourier(courier){

  shippingState.service=''; shippingState.cost=0; shippingState.options=[]; shippingState.confirmed=false;
  renderShippingOptions();
  if(courier==='grabexpress') return;
  if(!shippingState.destination){alert('Pilih tujuan pengiriman terlebih dahulu.');return;}
  const box=document.getElementById('serviceResults'); if(box) box.innerHTML='<div style="font-size:11px;color:#777">Menghitung ongkir '+shippingCourierLabel(courier)+'...</div>';
  try{
    const data=await edgeFetch('cost',{method:'POST',body:JSON.stringify({origin:76640,destination:Number(shippingState.destination.id),weight:roundedShippingWeight(),courier})});
    const rows=Array.isArray(data?.data)?data.data:[];
    shippingState.options=rows;
    if(!rows.length){box.innerHTML='<div style="font-size:11px;color:#b42318">Layanan '+shippingCourierLabel(courier)+' tidak tersedia untuk tujuan ini.</div>';return;}

    selectService(0);
  }catch(e){box.innerHTML='<div style="font-size:11px;color:#b42318">Gagal menghitung ongkir: '+escapeHtml(e.message||e)+'</div>';}
}

function productGalleryImages(p, selectedVariantId){
  const urls=[];
  const add=u=>{if(typeof u==='string'&&u.trim()&&!urls.includes(u.trim()))urls.push(u.trim())};
  add(p.image_url);
  if(Array.isArray(p.images))p.images.forEach(x=>add(typeof x==='string'?x:(x?.url||x?.image_url)));
  if(Array.isArray(p.image_urls))p.image_urls.forEach(add);
  if(typeof p.image_urls==='string')p.image_urls.split(/[\n,|]/).forEach(add);
  const variants=(p.variants||[]).filter(v=>v.is_active!==false);
  const selected=variants.find(v=>String(v.id)===String(selectedVariantId));
  if(selected)add(selected.image_url);
  variants.forEach(v=>add(v.image_url));
  return urls;
}

function renderStructuredDescription(description){
  const raw=String(description||'').replace(/\r/g,'').trim();
  if(!raw) return `<p class="desc">Belum ada deskripsi produk.</p>`;
  // Dua kali Enter (baris kosong) menjadi pemisah paragraf; satu Enter hanya pindah baris.
  const normalized=raw
    .replace(/<br\s*\/?\s*>/gi,'\n')
    .replace(/<\/(?:p|div|li|h[1-6])\s*>/gi,'\n')
    .replace(/<li\b[^>]*>/gi,'• ')
    .replace(/<[^>]*>/g,'')
    .replace(/&nbsp;/gi,' ')
    .replace(/&amp;/gi,'&').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>')
    .replace(/\n[ \t]+/g,'\n').trim();
  const blocks=normalized.split(/\n[ \t]*\n+/).map(x=>x.trim()).filter(Boolean);
  const clean=[];
  for(const block of blocks){
    const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);
    const text=lines.join('\n');
    if(text && !clean.some(x=>x.toLowerCase()===text.toLowerCase())) clean.push(text);
  }
  return `<div class="structured-description">${clean.map((part,i)=>`<p class="description-line${i<clean.length-1?' has-separator':''}">${part.split('\n').map(escapeHtml).join('<br>')}</p>`).join('')}</div>`;
}

function renderKahfDescriptions(p){
  const title=String(p.name||'').toLowerCase();
  const brand=String(p.brand||'').toLowerCase();
  const raw=String(p.description||'').trim();

  // Utamakan deskripsi lengkap yang tersimpan pada produk, termasuk produk Kahf.
  // Jangan mengganti isi deskripsi dengan teks contoh yang lebih pendek.
  if(raw.length>0 && raw.toLowerCase()!==brand && raw.toLowerCase()!=='kahf'){
    return `<div class="desc kahf-descriptions"><section class="desc-item"><h3>Deskripsi Produk</h3>${renderStructuredDescription(raw)}</section></div>`;
  }

  if(brand==='kahf' || title.includes('kahf')){
    return `<div class="desc kahf-descriptions"><section class="desc-item"><h3>Deskripsi Produk</h3><p>${escapeHtml(p.name||'Produk Kahf')} — informasi deskripsi belum tersedia. Silakan lengkapi deskripsi produk dari panel admin.</p></section></div>`;
  }
  return renderStructuredDescription(raw);
}

function productPriceLabel(p){
  const os=(p.options||[]).filter(o=>Number(o.stock)>0 && o.is_active!==false);
  if(os.length){const prices=os.map(o=>Number(o.price)||0);const min=Math.min(...prices),max=Math.max(...prices);return min===max?money(min):money(min)+' - '+money(max)}
  const vs=(p.variants||[]).filter(v=>v.is_active!==false);
  if(!vs.length)return money(p.price);const prices=vs.map(v=>Number(v.price??p.price)).filter(Number.isFinite);const min=Math.min(...prices),max=Math.max(...prices);return min===max?money(min):money(min)+' - '+money(max);
}
function promotionForProduct(p){return productPromotions.find(x=>String(x.product_id)===String(p?.id)&&x.is_active!==false)||null}
function applyPromotion(base,p){
 const price=Math.max(0,Number(base)||0),promo=promotionForProduct(p);if(!promo)return price;
 const value=Number(promo.discount_value)||0;
 const discounted=promo.discount_type==='percent'?price*(1-Math.min(100,value)/100):price-value;
 return Math.max(0,Math.round(discounted));
}
function productPriceMarkup(p){
 const baseLabel=productPriceLabel(p),promo=promotionForProduct(p);if(!promo)return escapeHtml(baseLabel);
 const os=(p.options||[]).filter(o=>Number(o.stock)>0&&o.is_active!==false);
 const vs=(p.variants||[]).filter(v=>v.is_active!==false);
 let bases=os.length?os.map(o=>Number(o.price)||0):vs.length?vs.map(v=>Number(v.price??p.price)||0):[Number(p.price)||0];
 let sales=bases.map(n=>applyPromotion(n,p));const oldMin=Math.min(...bases),oldMax=Math.max(...bases),newMin=Math.min(...sales),newMax=Math.max(...sales);
 const label=(a,b)=>a===b?money(a):money(a)+' - '+money(b);
 const pct=promo.discount_type==='percent'?Math.round(Number(promo.discount_value))+'%':'Hemat '+money(Math.max(0,oldMin-newMin));
 return `<span class="old" style="font-size:11px;margin:0 5px 0 0">${escapeHtml(label(oldMin,oldMax))}</span><span>${escapeHtml(label(newMin,newMax))}</span><span style="display:inline-block;margin-left:6px;background:#e85b7a;color:#fff;border-radius:6px;padding:2px 5px;font-size:9px;vertical-align:middle">${escapeHtml(pct)} OFF</span>`;
}
function cartBasePrice(i){const p=products.find(x=>String(x.id)===String(i.product_id));const o=optionForCart(i),v=variantForCart(i);return Number(o?.price??v?.price??p?.price)||0}
function cartLineMarkup(i){const p=products.find(x=>String(x.id)===String(i.product_id));if(!p)return '';const base=cartBasePrice(i),sale=applyPromotion(base,p),promo=promotionForProduct(p);return promo?`<span class="old" style="margin:0 5px 0 0">${money(base)}</span><b>${money(sale)}</b>`:money(base)}
function variantForCart(item){return item.variant_id?(products.find(p=>String(p.id)===String(item.product_id))?.variants||[]).find(v=>String(v.id)===String(item.variant_id)):null}
function optionForCart(item){const p=products.find(x=>String(x.id)===String(item.product_id));if(!p||!item.variant_id||!item.size_name)return null;const sid=(p.sizes||[]).find(s=>String(s.name).toLowerCase()===String(item.size_name).toLowerCase())?.id;return (p.options||[]).find(o=>String(o.variant_id)===String(item.variant_id)&&String(o.size_id)===String(sid))||null}
function cartLinePrice(i){const p=products.find(x=>String(x.id)===String(i.product_id));return applyPromotion(cartBasePrice(i),p)}
function cartLineWeight(i){const p=products.find(x=>String(x.id)===String(i.product_id));const o=optionForCart(i),v=variantForCart(i);return Number(o?.weight_grams??v?.weight_grams??p?.weight_grams)||1000}
function cartLineStock(i){const p=products.find(x=>String(x.id)===String(i.product_id));const o=optionForCart(i),v=variantForCart(i);return Number(o?.stock??v?.stock??p?.stock)||0}
function cartLineKey(productId,variantId,sizeName){return [productId,variantId||'',sizeName||''].join('|')}

function escapeHtml(s='') {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

  const hero=document.getElementById('homeHero');
  const img=document.getElementById('homeHeroPhoto');
  if(!hero||!img)return;
  const bundledBanner='hero-givitshop.png';

  if(!urls.length)urls=[bundledBanner];
  let track=hero.querySelector('.home-banner-track');
  hero.classList.add('has-photo');hero.style.touchAction='pan-y';
  if(!track){track=document.createElement('div');track.className='home-banner-track';const parent=img.parentElement||hero;parent.style.overflow='hidden';parent.style.position='relative';track.style.position='absolute';track.style.inset='0';parent.insertBefore(track,img);img.style.display='none';}
  track.innerHTML='';track.style.touchAction='pan-y';track.style.webkitUserSelect='none';track.style.userSelect='none';
  const oldControls=hero.querySelector('.home-banner-controls');if(oldControls)oldControls.remove();
  urls.forEach((url,i)=>{const slide=document.createElement('div');slide.className='home-banner-slide';const image=document.createElement('img');image.alt='Banner Givitshop '+(i+1);image.draggable=false;image.loading=i===0?'eager':'lazy';image.src=url+(url.includes('?')?'&':'?')+'banner_refresh='+Date.now();slide.appendChild(image);track.appendChild(slide)});

  (img.parentElement||hero).appendChild(controls);

  function restart(){if(timer)clearInterval(timer);if(urls.length>1)timer=setInterval(()=>go(index+1),5000)}
  function start(x,y){startX=x;startY=y;tracking=true}
  function finish(x,y){if(!tracking)return;tracking=false;const dx=x-startX,dy=y-startY;if(urls.length>1&&Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy)*1.15)go(index+(dx<0?1:-1))}

async function loadProducts() {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '<div class="empty">Memuat produk...</div>';
  try {
    const [data, variants, sizes, options] = await Promise.all([
      sbFetch('/rest/v1/products?select=*&is_active=eq.true&order=created_at.desc'),
      sbFetch('/rest/v1/product_variants?select=*&is_active=eq.true&order=created_at.asc'),
      sbFetch('/rest/v1/product_sizes?select=*&is_active=eq.true&order=created_at.asc'),
      sbFetch('/rest/v1/product_variant_options?select=*&is_active=eq.true&order=created_at.asc')
    ]);
    products = Array.isArray(data) ? data : [];
    productVariants = Array.isArray(variants) ? variants : [];
    productSizes = Array.isArray(sizes) ? sizes : [];
    const productOptions = Array.isArray(options) ? options : [];
    products.forEach(p=>{p.variants=productVariants.filter(v=>String(v.product_id)===String(p.id));p.sizes=productSizes.filter(x=>String(x.product_id)===String(p.id));p.options=productOptions.filter(o=>String(o.product_id)===String(p.id));p.reviewAverage=null;p.reviewCount=0;});
    // Promo khusus produk; kegagalan membaca tabel promo tidak mengganggu katalog.
    try {
      const promos = await sbFetch('/rest/v1/product_promotions?select=*&is_active=eq.true&order=created_at.desc');
      const now = Date.now();
      productPromotions = (Array.isArray(promos)?promos:[]).filter(x=>
        (!x.start_at || new Date(x.start_at).getTime()<=now) &&
        (!x.end_at || new Date(x.end_at).getTime()>=now)
      );
    } catch(e) { productPromotions=[]; console.warn('Promo produk belum tersedia:',e.message); }
    // Ambil rating dari ulasan terverifikasi; jangan tampilkan angka rating palsu.
    await Promise.allSettled(products.map(async p=>{
      const rows=await sbFetch('/rest/v1/rpc/get_product_reviews',{method:'POST',body:JSON.stringify({p_product_id:p.id})});
      if(Array.isArray(rows)&&rows.length){p.reviewCount=rows.length;p.reviewAverage=rows.reduce((sum,r)=>sum+Number(r.rating||0),0)/rows.length;}
    }));
    renderProducts();
    updateCartBadges();
    openSharedProductFromUrl();
  } catch (e) {
    console.error(e);
    grid.innerHTML = `<div class="empty"><h3>Produk belum dapat dimuat</h3><p style="font-size:11px">${escapeHtml(e.message)}</p><button class="cta" onclick="loadProducts()">Coba Lagi</button></div>`;
  }
}

async function placeOrder() {
  const customer_name=document.getElementById('custName').value.trim();
  const customer_phone=document.getElementById('custPhone').value.trim();
  const customer_address=document.getElementById('custAddress').value.trim();
  if(!customer_name || !customer_phone || !customer_address){alert('Lengkapi nama, nomor WhatsApp, dan alamat.');return;}
  const btn=document.getElementById('orderBtn'); btn.disabled=true; btn.textContent='Menyimpan pesanan...';
  try {
    const items=cart.map(i=>({product_id:i.product_id,variant_id:i.variant_id||null,size_name:i.size_name||null,quantity:i.qty}));
    const shippingIsManual = shippingState.courier==='grabexpress';
    if(!shippingState.courier){throw new Error('Pilih ekspedisi terlebih dahulu.');}
    if(!shippingState.destination){throw new Error('Pilih tujuan pengiriman terlebih dahulu.');}
    if(!shippingIsManual && !shippingState.service){throw new Error('Pilih layanan pengiriman terlebih dahulu.');}
    const shippingCost = shippingIsManual ? 0 : Number(shippingState.cost||0);
    const total=items.reduce((s,i)=>s+i.subtotal,0)+shippingCost;
    const token=paymentToken();
    const order=await sbFetch('/rest/v1/rpc/place_order',{
      method:'POST',
      body:JSON.stringify({
        p_customer_name:customer_name,
        p_customer_phone:customer_phone,
        p_customer_address:customer_address,
        p_payment_token:token,
        p_items:items,
        p_shipping_courier:shippingState.courier,
        p_shipping_service:shippingState.service || (shippingIsManual ? 'Ongkir dikonfirmasi admin' : 'Ongkir'),
        p_shipping_cost:shippingCost,
        p_voucher_code:appliedVoucher?.code || null
      })
    });
    if(!order || !order.id) throw new Error('Order tidak mengembalikan ID.');

    // Ambil kode akses 6 digit dari database setelah order berhasil dibuat.
    try {
      const codeResult=await sbFetch('/rest/v1/rpc/get_order_access_code',{
        method:'POST',
        body:JSON.stringify({p_order_id:order.id,p_payment_token:token})
      });
      const accessCode=typeof codeResult==='string'
        ? codeResult
        : (Array.isArray(codeResult) ? codeResult[0] : codeResult);
      order.access_code=String(accessCode||'');
    } catch(e) {
      order.access_code='';
    }

    lastOrder=order;
    lastCustomerPhone=customer_phone;
    lastAccessCode=order.access_code||'';
    cart=[];
    renderCart();
    if(!order.shipping_confirmed){
      showShippingPending(order);
    } else {
      showPayment(order);
    }

  } catch(e) {
    const msg='Pesanan gagal disimpan: '+(e && e.message ? e.message : e);
    const err=document.getElementById('orderError');
    if(err){err.style.display='block';err.textContent=msg;}
    btn.disabled=false; btn.textContent='Buat Pesanan';
  }
}

async function openMyOrder(orderId){
  const phone=(document.getElementById('ordersPhone')?.value||lastCustomerPhone||'').trim();
  const accessCode=(document.getElementById('ordersAccessCode')?.value||lastAccessCode||'').trim();
  if(!phone || !/^\d{6}$/.test(accessCode)){
    alert('Nomor WhatsApp dan kode akses 6 digit diperlukan.');
    return;
  }
  try{
    const rows=await sbFetch('/rest/v1/rpc/get_my_order_secure_detail',{
      method:'POST',
      body:JSON.stringify({
        p_order_id:Number(orderId),
        p_customer_phone:phone,
        p_access_code:accessCode
      })
    });
    const order=Array.isArray(rows)?rows[0]:rows;
    if(!order){alert('Pesanan tidak ditemukan atau akses tidak sesuai.');return;}
    lastCustomerPhone=phone;
    lastAccessCode=String(order.access_code||accessCode);
    lastOrder=order;
    if(order.status==='cancelled'){
      showOrderStatus(order.id,phone);
      return;
    }
    if(order.payment_status==='unpaid'){
      if(order.shipping_confirmed===false){
        showShippingPending(order);
      }else if(order.payment_token){
        showPayment(order);
      }else{
        alert('Token pembayaran tidak tersedia. Silakan hubungi admin Givitshop.');
      }
      return;
    }
    showOrderStatus(order.id,phone);
  }catch(e){
    alert('Gagal membuka pesanan: '+(e.message||e));
  }
}

let appliedVoucher=null;
async function applyCheckoutVoucher(){
 const input=document.getElementById('checkoutVoucherCode'),msg=document.getElementById('voucherApplyMsg');
 if(!input||!msg)return;
 const code=input.value.trim().toUpperCase();
 if(!code){appliedVoucher=null;msg.textContent='Masukkan kode voucher terlebih dahulu.';updateCheckoutTotals();return}
 msg.textContent='Memeriksa voucher...';
 try{
  const rows=await sbFetch('/rest/v1/vouchers?select=id,title,code,description,discount_type,discount_value,min_purchase,start_at,end_at,usage_limit,used_count,is_active&code=eq.'+encodeURIComponent(code)+'&limit=1');
  const v=Array.isArray(rows)?rows[0]:null,now=Date.now();
  if(!v||!v.is_active||(v.start_at&&new Date(v.start_at).getTime()>now)||(v.end_at&&new Date(v.end_at).getTime()<now)||(v.usage_limit!=null&&Number(v.used_count||0)>=Number(v.usage_limit)))throw new Error('Voucher tidak tersedia atau sudah kedaluwarsa.');
  const subtotal=cartSubtotal();
  if(subtotal<Number(v.min_purchase||0))throw new Error('Minimum belanja voucher '+moneyIDR(v.min_purchase)+'.');
  appliedVoucher={code:v.code,title:v.title,discount_type:v.discount_type,discount_value:Number(v.discount_value),min_purchase:Number(v.min_purchase||0)};
  msg.textContent='Voucher '+v.code+' berhasil dipasang. Potongan akan divalidasi kembali saat pesanan dibuat.';
  updateCheckoutTotals();
 }catch(e){appliedVoucher=null;msg.textContent=e.message||'Voucher tidak dapat digunakan.';updateCheckoutTotals()}
}
function updateCheckoutTotals(){
 const el=document.getElementById('checkoutTotal');if(!el)return;
 const subtotal=cartSubtotal();let discount=0;
 if(appliedVoucher){discount=appliedVoucher.discount_type==='percent'?Math.round(subtotal*Math.min(100,appliedVoucher.discount_value)/100):Math.min(subtotal,appliedVoucher.discount_value)}
 el.textContent=money(Math.max(0,subtotal-discount)+(shippingState.courier==='grabexpress'?0:Number(shippingState.cost||0)));
 const summary=document.getElementById('voucherDiscountSummary');
 if(summary)summary.textContent=discount>0?'Potongan voucher: −'+money(discount):'';
}

// Chat admin pra-pembelian: tidak perlu checkout atau nomor pesanan.
let activeGuestChat = null;
async function chatRpc(fn, body){
  const res=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{
    method:'POST',headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)
  });
  const txt=await res.text();let data=null;try{data=txt?JSON.parse(txt):null}catch(_){}
  if(!res.ok)throw new Error(data?.message||data?.hint||txt||'Gagal mengakses chat');return data;
}
function savedGuestChat(){try{return JSON.parse(localStorage.getItem('givitshop_guest_chat_v1')||'null')}catch(_){return null}}

  <label for="guestChatName">Nama</label><input id="guestChatName" maxlength="100" autocomplete="name" value="${escapeHtml(saved?.name||'')}" placeholder="Nama kamu" style="width:100%;padding:12px;margin-top:6px;border:1px solid var(--line);border-radius:10px;box-sizing:border-box">
  <label for="guestChatPhone" style="display:block;margin-top:12px">Nomor WhatsApp</label><input id="guestChatPhone" inputmode="tel" autocomplete="tel" value="${escapeHtml(saved?.phone||'')}" placeholder="08xxxxxxxxxx" style="width:100%;padding:12px;margin-top:6px;border:1px solid var(--line);border-radius:10px;box-sizing:border-box">
  <button class="cta" style="width:100%;margin-top:14px" onclick="startCustomerGuestChat()">Mulai Chat Admin</button>
  ${saved?.conversationId&&saved?.token?'<button class="secondarybtn" style="width:100%;margin-top:8px" onclick="resumeCustomerGuestChat()">Lanjutkan Chat Sebelumnya</button>':''}
  <button class="secondarybtn" style="width:100%;margin-top:8px" onclick="renderAccount()">Kembali ke Akun</button><p id="guestChatError" style="color:#b42345;font-size:12px"></p></div>`);

function makeGuestToken(){const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}
async function startCustomerGuestChat(){
  const name=(document.getElementById('guestChatName')?.value||'').trim();
  const phone=(document.getElementById('guestChatPhone')?.value||'').trim();
  const error=document.getElementById('guestChatError');
  if(name.length<2||name.length>100){if(error)error.textContent='Masukkan nama 2–100 karakter.';return}
  if(phone.replace(/\D/g,'').length<8||phone.replace(/\D/g,'').length>20){if(error)error.textContent='Masukkan nomor WhatsApp yang benar.';return}
  try{
    const token=makeGuestToken();
    const id=await chatRpc('customer_start_guest_chat',{p_customer_name:name,p_customer_phone:phone,p_guest_token:token});
    activeGuestChat={conversationId:String(id),token,name,phone};
    localStorage.setItem('givitshop_guest_chat_v1',JSON.stringify(activeGuestChat));
    await renderCustomerGuestChat();
  }catch(e){if(error)error.textContent='Chat belum bisa dibuat: '+e.message+'. Pastikan SQL chat pra-pembelian sudah dijalankan di Supabase.'}
}
async function resumeCustomerGuestChat(){
  const s=savedGuestChat();if(!s?.conversationId||!s?.token)return;
  activeGuestChat=s;await renderCustomerGuestChat();
}
async function renderCustomerGuestChat(){
  const c=activeGuestChat;if(!c)return;
  accountPage('Chat Admin',`<div class="checkout"><p style="color:#777;font-size:13px">Chat pra-pembelian dengan admin Givitshop. Riwayat pesan tersimpan.</p><div id="customerChatMessages" style="height:42vh;min-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff"></div><div style="display:flex;gap:8px;margin-top:10px;align-items:end"><textarea id="customerChatInput" rows="2" maxlength="2000" placeholder="Tulis pesan untuk admin..." style="flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px"></textarea><button class="cta" onclick="sendCustomerGuestChatMessage()">Kirim</button></div><p id="customerChatStatus" style="font-size:12px;color:#777"></p><button class="secondarybtn" onclick="renderAccount()">Kembali ke Akun</button></div>`);
  await loadCustomerGuestChatMessages();
}
async function loadCustomerGuestChatMessages(){
  const c=activeGuestChat,box=document.getElementById('customerChatMessages');if(!c||!box)return;
  try{
    const rows=await chatRpc('customer_get_guest_chat_messages',{p_conversation_id:c.conversationId,p_guest_token:c.token});
    box.innerHTML=(rows||[]).map(m=>`<div style="display:flex;justify-content:${m.sender_role==='customer'?'flex-end':'flex-start'};margin:8px 0"><div style="max-width:85%;padding:10px 12px;border-radius:14px;background:${m.sender_role==='customer'?'#e85b7a':'#f4eef1'};color:${m.sender_role==='customer'?'#fff':'#28242a'};white-space:pre-wrap;overflow-wrap:anywhere">${escapeHtml(m.message)}<div style="font-size:10px;opacity:.75;margin-top:5px">${new Date(m.created_at).toLocaleString('id-ID')}</div></div></div>`).join('')||'<div class="empty">Belum ada pesan. Silakan kirim pesan kepada admin.</div>';
    box.scrollTop=box.scrollHeight;const s=document.getElementById('customerChatStatus');if(s)s.textContent='Riwayat chat diperbarui.';
  }catch(e){const s=document.getElementById('customerChatStatus');if(s)s.textContent='Gagal memuat chat: '+e.message}
}
setInterval(()=>{if(activeGuestChat&&document.getElementById('customerChatMessages'))loadCustomerGuestChatMessages()},5000);
async function sendCustomerGuestChatMessage(){
  const c=activeGuestChat,input=document.getElementById('customerChatInput'),status=document.getElementById('customerChatStatus');const message=(input?.value||'').trim();
  if(!c||!message)return;if(message.length>2000){alert('Pesan maksimal 2.000 karakter.');return}
  try{if(status)status.textContent='Mengirim...';await chatRpc('customer_send_guest_chat_message',{p_conversation_id:c.conversationId,p_guest_token:c.token,p_message:message});input.value='';await loadCustomerGuestChatMessages()}
  catch(e){if(status)status.textContent='Pesan gagal dikirim: '+e.message}
}
loadHomeBanner();
loadProducts();

// Robust horizontal gallery swipe for Android WebView and mobile browsers.
(function enableProductGallerySwipe(){
  let startX=0,startY=0,startLeft=0,dragging=false;
  document.addEventListener('touchstart',function(e){const g=e.target.closest&&e.target.closest('#detailGallery');if(!g||!e.touches||e.touches.length!==1)return;startX=e.touches[0].clientX;startY=e.touches[0].clientY;startLeft=g.scrollLeft;dragging=true;},{passive:true});
  document.addEventListener('touchmove',function(e){const g=e.target.closest&&e.target.closest('#detailGallery');if(!g||!dragging||!e.touches||e.touches.length!==1)return;const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;if(Math.abs(dx)>Math.abs(dy)+4){g.scrollLeft=startLeft-dx;}},{passive:true});
  document.addEventListener('touchend',function(){dragging=false;},{passive:true});
  document.addEventListener('touchcancel',function(){dragging=false;},{passive:true});
  document.addEventListener('pointerdown',function(e){const g=e.target.closest&&e.target.closest('#detailGallery');if(!g||e.pointerType!=='mouse')return;startX=e.clientX;startLeft=g.scrollLeft;dragging=true;});
  document.addEventListener('pointermove',function(e){const g=document.getElementById('detailGallery');if(!g||!dragging||e.pointerType!=='mouse'||!(e.buttons&1))return;g.scrollLeft=startLeft-(e.clientX-startX);});
  document.addEventListener('pointerup',function(){dragging=false;});
})();
